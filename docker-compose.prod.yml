x-deploy: &deploy
  deploy:
    placement:
      constraints:
        - "node.role==worker"
        - "node.labels.service==antijob_bot_reviews"
        - "node.labels.environment==production"
    replicas: 1
    update_config:
      order: start-first
      parallelism: 1
      delay: 10s
    rollback_config:
      order: stop-first
      parallelism: 1
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 2
      window: 120s
services:
  bot:
    <<: *deploy
    image: antijob/antijob-bot:${IMAGE_TAG:-main}
    environment:
      TOKEN_FILE: /run/secrets/TOKEN
      DB_HOST: ${DB_HOST:-redis}
      DB_PORT: ${DB_PORT:-6379}
      DB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      ADMINS: ${ADMINS}
      FEEDBACK_CHAT_ID: ${FEEDBACK_CHAT_ID}
      MAIN_URL: ${MAIN_URL:-https://antijob.net}
      NEWS_URL: ${NEWS_URL:-https://antijob.media}
    secrets:
      - source: TOKEN
        target: TOKEN
      - source: DB_PASSWORD
        target: DB_PASSWORD
    networks:
      - bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        max-buffer-size: "4m"

  redis:
    <<: *deploy
    image: redis:7-alpine
    secrets:
      - source: DB_PASSWORD
        target: DB_PASSWORD
    command:
      - sh
      - -c
      - redis-server --port ${DB_PORT:-6379} --requirepass "$$(cat /run/secrets/DB_PASSWORD)"
    volumes:
      - redis:/data
    networks:
      - bot
    deploy:
      update_config:
        order: stop-first
        parallelism: 1
        delay: 10s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -p ${DB_PORT:-6379} -a "$$(cat /run/secrets/DB_PASSWORD)" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        mode: "non-blocking"
        max-buffer-size: "2m"

volumes:
  redis:

networks:
  bot:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24

secrets:
  TOKEN:
    external: true
    name: secret.TOKEN
  DB_PASSWORD:
    external: true
    name: secret.DB_PASSWORD
