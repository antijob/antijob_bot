x-deploy: &deploy
  deploy:
    placement:
      constraints:
        - "node.role==worker"
        - "node.labels.service==antijob_bot_reviews"
        - "node.labels.environment==production"
    replicas: 1
    update_config:
      order: start-first
      parallelism: 1
      delay: 10s
    rollback_config:
      order: stop-first
      parallelism: 1
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 2
      window: 120s
services:

  antijob_bot:
    <<: *deploy
    image: antijob_bot:${IMAGE_TAG:-main}
    env_file:
      - .env
    networks:
      - antijob_bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        mode: "non-blocking"
        max-buffer-size: "4m"

  redis:
    <<: *deploy
    image: redis:7-alpine
    command: redis-server --port ${DB_PORT} --requirepass ${DB_PASSWORD}
    volumes:
      - redis:/data
    networks:
      - antijob_bot
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${DB_PORT}", "-a", "${DB_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        mode: "non-blocking"
        max-buffer-size: "2m"

volumes:
  redis:

networks:
  antijob_bot:
    driver: overlay
    attachable: true
